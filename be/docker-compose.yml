services:
  postgres:
    image: postgres:16-alpine
    container_name: fasqindo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fasqindo
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fasqindo"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO official images were removed from Docker Hub (Sep 2026).
  # pgsty/silo is a community drop-in MinIO fork: same env vars, same API,
  # S3-compatible — works unchanged with the backend STORAGE_* config.
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: fasqindo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
